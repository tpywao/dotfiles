shell = "zsh"

[templates]
# zsh-defer で遅延ロード（最初のプロンプト描画後に source）するためのテンプレート
defer = "{{ hooks?.pre | nl }}{% for file in files %}zsh-defer source \"{{ file }}\"\n{% endfor %}{{ hooks?.post | nl }}"

[plugins]

# Completions (must be in fpath before compinit)
[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
apply = ["fpath"]

[plugins.docker-completion]
remote = "https://raw.githubusercontent.com/docker/cli/master/contrib/completion/zsh/_docker"
apply = ["fpath"]

[plugins.git-completion]
remote = "https://raw.githubusercontent.com/git/git/master/contrib/completion/git-completion.zsh"
apply = ["fpath"]

# Plugins (load after completions)
# zsh-defer は defer テンプレートを使うプラグインより前に定義する必要がある
[plugins.zsh-defer]
github = "romkatv/zsh-defer"

# 起動を体感即時にするため、最初のプロンプト描画後に遅延ロードする
[plugins.fast-syntax-highlighting]
github = "zdharma-continuum/fast-syntax-highlighting"
apply = ["defer"]

# main は初回ロード時に依存の z-async を ~/.cache へ git clone し、以降 git pull で
# 追従する。シェル起動時のネットワークアクセスを避けるため、z-async が同梱されている
# タグに固定する。
[plugins.zsh-autocomplete]
github = "marlonrichert/zsh-autocomplete"
tag = "26.08.04"
use = ["zsh-autocomplete.plugin.zsh"]

# job-queue(uuidgen 等のサブプロセス起動)が起動時に重い(~221ms)ため遅延ロードする
[plugins.zsh-abbr]
github = "olets/zsh-abbr"
apply = ["defer"]
