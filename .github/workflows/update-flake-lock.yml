# flake.lock を週次で更新して PR を作成する
# ロック更新は outputs を評価しないため --impure は不要
name: update-flake-lock

on:
  workflow_dispatch: # 手動実行
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 00:00 UTC

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: "."
            branch: update-flake-lock/root
            title: "chore(nix): update flake.lock"
          - dir: ai-tools
            branch: update-flake-lock/ai-tools
            title: "chore(ai-tools): update ai-tools/flake.lock"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: DeterminateSystems/determinate-nix-action@fd3eb131b9b46cc1dd978a7c0ba3fce79dd7d3eb # v3.9.1
      - uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          path-to-flake-dir: ${{ matrix.dir }}
          branch: ${{ matrix.branch }}
          pr-title: ${{ matrix.title }}
