version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]

  # root と ai-tools はそれぞれ flake.lock を持つ
  - package-ecosystem: "nix"
    directories:
      - "/"
      - "/ai-tools"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(nix)"
    groups:
      flake-inputs:
        patterns: ["*"]

  # ccusage / codegraph。flake.nix の npmDepsHash は
  # .github/workflows/dependabot-npm-deps-hash.yml が PR 上で再計算する
  - package-ecosystem: "npm"
    directory: "/ai-tools"
    schedule:
      interval: "weekly"
    # 公開直後のバージョンは乗っ取られたリリースが取り下げられる前のことがあるため、数日置いてから提案させる
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ai-tools)"
    groups:
      ai-tools-npm:
        patterns: ["*"]
